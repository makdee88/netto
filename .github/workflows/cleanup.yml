name: Prune Old Cloudflare Previews

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune Old Preview Deployments
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: netto
          KEEP_COUNT: 5
        run: |
          echo "Fetching preview deployments for project: ${PROJECT_NAME}..."

          PAGE=1
          ALL_DEPLOYMENTS="[]"

          # Loop through pages (Cloudflare Pages maximum per_page is 25)
          while true; do
            RESPONSE=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments?page=${PAGE}&per_page=25" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json")

            SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
            if [ "$SUCCESS" != "true" ]; then
              echo "Failed to fetch deployments on page ${PAGE}:"
              echo "$RESPONSE" | jq -r '.errors'
              exit 1
            fi

            COUNT=$(echo "$RESPONSE" | jq '.result | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            # Append current page results
            ALL_DEPLOYMENTS=$(jq -s '.[0] + .[1].result' <(echo "$ALL_DEPLOYMENTS") <(echo "$RESPONSE"))

            # Stop if this was the last page
            TOTAL_PAGES=$(echo "$RESPONSE" | jq -r '.result_info.total_pages // 1')
            if [ "$PAGE" -ge "$TOTAL_PAGES" ]; then
              break
            fi

            PAGE=$((PAGE + 1))
          done

          # Filter preview deployments, sort newest first, skip KEEP_COUNT, extract remaining IDs
          TO_DELETE=$(echo "$ALL_DEPLOYMENTS" | jq -r --argjson KEEP "$KEEP_COUNT" '
            [ .[] | select(.environment == "preview") ]
            | sort_by(.created_on) | reverse
            | .[$KEEP:] | .[].id
          ')

          if [ -z "$TO_DELETE" ]; then
            echo "No stale preview deployments to prune."
            exit 0
          fi

          for ID in $TO_DELETE; do
            echo "Deleting preview deployment: $ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${ID}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}"
          done

          echo "Pruning completed successfully."