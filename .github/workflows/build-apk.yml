name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Manual release build of Netto mobile APK.'

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync / Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "android directory missing, adding android platform..."
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android App Icons (White Background)
        run: |
          mkdir -p assets
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

          # Fix AAPT missing background resource for adaptive icons
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          # Point adaptive XMLs to @drawable/ic_launcher_background if referencing mipmap
          sed -i 's|@mipmap/ic_launcher_background|@drawable/ic_launcher_background|g' \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
          sed -i 's|@mipmap/ic_launcher_background|@drawable/ic_launcher_background|g' \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Decode Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not defined or empty!"
            exit 1
          fi

          printf "%s" "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

          KEYSTORE_SIZE=$(wc -c < android/release.keystore)
          echo "Keystore size: $KEYSTORE_SIZE bytes"

          if [ "$KEYSTORE_SIZE" -le 100 ]; then
            echo "ERROR: Decoded keystore file is too small ($KEYSTORE_SIZE bytes)."
            exit 1
          fi

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/netto-release.apk"

          # 1. Zipalign APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $UNSIGNED_APK $ALIGNED_APK

          # 2. Sign APK with apksigner
          $BUILD_TOOLS_DIR/apksigner sign --ks android/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out $SIGNED_APK $ALIGNED_APK

          # 3. Verify signature
          $BUILD_TOOLS_DIR/apksigner verify $SIGNED_APK

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netto-v${{ github.event.inputs.version_name }}-apk
          path: android/app/build/outputs/apk/release/netto-release.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version_name }}
          name: Netto v${{ github.event.inputs.version_name }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/netto-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}