name: Generate Keystore Once

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for Keystore'
        required: true
        default: 'NettoSafePassword2026'

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore and Encode
        run: |
          PASS="${{ github.event.inputs.password }}"
          keytool -genkeypair -v \
            -keystore netto.keystore \
            -alias netto-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Netto, O=Netto, C=SE"

          # Check raw size (should be ~2600 bytes)
          ls -l netto.keystore

          # Write base64 without line breaks to a file
          base64 -w 0 netto.keystore > keystore_base64.txt

      - name: Upload Keystore Base64 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secret-file
          path: keystore_base64.txt
          retention-days: 1