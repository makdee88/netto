name: Generate Keystore Once

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password for Keystore'
        required: true
        default: 'NettoSafePassword2026'

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Base64 Encode
        run: |
          PASS="${{ github.event.inputs.password }}"
          keytool -genkeypair -v \
            -keystore netto.keystore \
            -alias netto-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Netto, O=Netto, C=SE"

          echo "=========================================="
          echo "COPY THIS ENTIRE BASE64 STRING BELOW:"
          echo "=========================================="
          base64 -w 0 netto.keystore
          echo ""
          echo "=========================================="