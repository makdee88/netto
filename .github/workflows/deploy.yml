name: Deploy Netto

on:
  # Automatically build & deploy previews on feature branches or pull requests
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  
  # Allow manual triggering for production deployment
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'netto'
          directory: 'dist'
          # If triggered manually via workflow_dispatch, deploy to 'main' (Production).
          # Otherwise, deploy as an automatic preview using the branch name.
          branch: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}